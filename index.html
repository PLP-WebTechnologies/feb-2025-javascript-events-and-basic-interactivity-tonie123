<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
         <h1>Interactive Web Experience</h1>
        </header>

        <!-- Interactive Buttons Section -->
        <section class="interactive-section">
            <h2>Interactive Elements</h2>
            <button id="colorButton" class="btn">Change My Color</button>
            <button id="textButton" class="btn">Change My Text</button>

            <!-- Image Gallery -->
            <div class="gallery">
                <h3>Image Gallery</h3>
                <div class="gallery-container">
                    <button id="prevBtn" class="gallery-btn">&lt;</button>
                    <div class="gallery-image">
                        <img src="https://picsum.photos/400/300?random=1" alt="Gallery Image 1" id="galleryImg">
                    </div>
                    <button id="nextBtn" class="gallery-btn">&gt;</button>
                </div>
            </div>

            <!-- Accordion -->
            <div class="accordion">
                <h3>Accordion Content</h3>
                <div class="accordion-item">
                    <button class="accordion-header">Section 1</button>
                    <div class="accordion-content">
                        <p>This is the content for section 1. Click the header to toggle visibility!</p>
                    </div>
                </div>
                <div class="accordion-item">
                    <button class="accordion-header">Section 2</button>
                    <div class="accordion-content">
                        <p>This is the content for section 2. Try the double-click secret!</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Form Validation Section -->
        <section class="form-section">
            <h2>Form Validation</h2>
            <form id="validationForm">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" required>
                    <span class="validation-message"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                    <span class="validation-message"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" required>
                    <span class="validation-message"></span>
                </div>

                <button type="submit" class="btn">Submit</button>
            </form>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
